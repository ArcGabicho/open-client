services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: openclient-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - openclient_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: openclient-db-init
    environment:
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  openclient:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openclient
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OpenClientDb;User Id=openclient_user;Password=${MSSQL_APP_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  openclient_data: