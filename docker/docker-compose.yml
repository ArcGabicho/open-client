services:
  open-client-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: open_client_database
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ArcGabicho05$
    ports:
      - "1433:1433"
    volumes:
      - open_client_data:/var/opt/mssql/data

volumes:
  open_client_data:
    driver: local